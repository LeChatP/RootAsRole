[workspace]
members = ["xtask", "core", "exec"]

[workspace.dependencies]
rootasrole-core = { path = "core" }
rootasrole-exec = { path = "exec" }

[workspace.package]
edition = "2024"
rust-version = "1.93.0"
version = "4.0.2"
license = "LGPL-3.0-or-later"
homepage = "https://lechatp.github.io/RootAsRole/"
repository = "https://github.com/LeChatP/RootAsRole"
authors = ["Eddie Billoir <lechatp@outlook.fr>"]


[package]
name = "rootasrole"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "dosr"
description = "A better alternative to sudo(-rs)/su"


keywords = ["sudo", "capabilities", "rbac", "linux", "security"]
categories = ["command-line-utilities", "os::linux-apis", "config"]
exclude = ["sudoers-reader/*", "book/*"]


[badges]
maintainance ={ status = "actively-maintained", badge = "https://img.shields.io/badge/maintenance-actively%20maintained-brightgreen.svg" }


[profile.release]
strip = "symbols"
lto = true
opt-level = 3
codegen-units = 1

[profile.profiling]
strip = "none"
lto = false
opt-level = 1
inherits = "release"
debug = true

[[bin]]
name = "dosr"
path = "src/dosr/main.rs"
required-features = ["finder"]


[[bin]]
name = "chsr"
path = "src/chsr/main.rs"
required-features = ["editor"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["finder"]

[features]
finder = ["plugins", "timeout", "pcre2", "glob", "landlock", "rootasrole-core/finder", "dep:nonstick2", "dep:libpam-sys", "dep:indexmap"]
glob = ["rootasrole-core/glob"]
pcre2 = ["dep:pcre2", "rootasrole-core/pcre2"]
plugins = ["hashchecker", "ssd", "hierarchy"]
hashchecker = ["dep:hex", "dep:sha2"]
ssd = []
hierarchy = []
timeout = []
landlock = ["dep:landlock", "dep:bitflags", "dep:glob"]
editor = ["dep:landlock", "dep:libseccomp", "dep:pest", "dep:pest_derive", "dep:indexmap", "dep:konst"]

[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = 1 }
nursery = { level = "warn", priority = 1 }
unwrap_used = { level = "deny", priority = 2 }
similar_names = { level = "allow", priority = 2 }
should_implement_trait = { level = "allow", priority = 2 }

[package.metadata.clippy]
allow-unwrap-in-tests = true

[build-dependencies]
toml = { version = "0.9", default-features = false, features = ["serde","parse", "display", "preserve_order"] }

[dependencies]
rootasrole-core = { workspace = true }
rootasrole-exec = { workspace = true }
log = { version = "0.4", default-features = false, features = ["std"] }
libc = { version = "0.2", default-features = false, features = ["std"]}
nix = { version = ">=0.30, <0.32", features = ["user", "process", "signal", "fs"] }
capctl = { version = "0.2", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features=["std", "rc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
cbor4ii = { version = "1.2", default-features = false, features = ["serde", "serde1", "use_std"] }
shell-words = { version = "1.1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["now"] }
const_format = { version = "0.2", default-features = false }
bon = { version = "3", default-features = false }
## dosr
nonstick2 = { version = "0.1", optional = true }
libpam-sys = { version = "0.2", default-features = false, optional = true }
pcre2 = { version = "0.2", default-features = false, optional = true }
glob = { version = "0.3", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
## chsr
pest = { version = "2.9", default-features = false, features = ["std"], optional = true }
pest_derive = { version = "2.9", default-features = false, features = ["std"], optional = true }
indexmap = { version = "2.14", default-features = false, features = ["std"], optional = true }
hex = { version = "0.4", default-features = false, optional = true, features = ["alloc"]}
landlock = { version = "0.4", optional = true }
libseccomp = { version = "0.4", optional = true }
bitflags = { version = ">=2.9, <2.14", default-features = false, optional = true }
konst = { version= "0.4", default-features = false, optional = true, features = ["parsing_proc", "iter"] }


[dev-dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
env_logger = { version = "0.11", default-features = false }
test-log = { version = "0.2", default-features = false }
