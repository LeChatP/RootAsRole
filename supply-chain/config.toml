
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.ariel-os]
url = "https://raw.githubusercontent.com/ariel-os/ariel-os/main/supply-chain/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.rootasrole]
audit-as-crates-io = false

[policy.rootasrole-core]
audit-as-crates-io = false

[policy.rootasrole-exec]
audit-as-crates-io = false

[[exemptions.cfg_aliases]]
version = "0.2.1"
criteria = "safe-to-deploy"

[[exemptions.const_format]]
version = "0.2.36"
criteria = "safe-to-deploy"

[[exemptions.const_format_proc_macros]]
version = "0.2.34"
criteria = "safe-to-deploy"

[[exemptions.const_panic]]
version = "0.2.15"
criteria = "safe-to-deploy"

[[exemptions.crossbeam-utils]]
version = "0.8.21"
criteria = "safe-to-deploy"
notes = "Base of the audited delta to 0.8.23. RaR reaches only CachePadded (through ringbuf); the rest of the crate was not reviewed."

[[exemptions.darling]]
version = "0.23.0"
criteria = "safe-to-deploy"

[[exemptions.darling_core]]
version = "0.23.0"
criteria = "safe-to-deploy"

[[exemptions.darling_macro]]
version = "0.23.0"
criteria = "safe-to-deploy"

[[exemptions.defmt]]
version = "1.2.0"
criteria = "safe-to-deploy"
notes = "Never compiled: cargo metadata lists it through the weak feature defmt?/alloc of jiff and jiff-core, whose defmt feature RaR never enables. Not reviewed."

[[exemptions.defmt-macros]]
version = "1.2.0"
criteria = "safe-to-deploy"
notes = "Never compiled: cargo metadata lists it through the weak feature defmt?/alloc of jiff and jiff-core, whose defmt feature RaR never enables. Not reviewed."

[[exemptions.defmt-parser]]
version = "1.1.0"
criteria = "safe-to-deploy"
notes = "Never compiled: cargo metadata lists it through the weak feature defmt?/alloc of jiff and jiff-core, whose defmt feature RaR never enables. Not reviewed."

[[exemptions.ident_case]]
version = "1.0.1"
criteria = "safe-to-deploy"

[[exemptions.konst]]
version = "0.2.20"
criteria = "safe-to-deploy"
notes = "Not reviewed. RaR uses it in const items over env!() build values (evaluated by rustc's const evaluator); at run time only eq_str, a byte comparison."

[[exemptions.konst]]
version = "0.4.3"
criteria = "safe-to-deploy"
notes = "Not reviewed. RaR uses it in const items over env!() build values (evaluated by rustc's const evaluator); at run time only eq_str, a byte comparison."

[[exemptions.konst_macro_rules]]
version = "0.2.19"
criteria = "safe-to-deploy"
notes = "Not reviewed. RaR uses it in const items over env!() build values (evaluated by rustc's const evaluator); at run time only eq_str, a byte comparison."

[[exemptions.konst_proc_macros]]
version = "0.4.1"
criteria = "safe-to-deploy"
notes = "Not reviewed. Proc macro of konst, run at compile time."

[[exemptions.portable-atomic]]
version = "1.15.0"
criteria = "safe-to-deploy"
notes = "Only built for targets without pointer-width atomics (jiff) or with ringbuf's optional portable-atomic feature (off in RaR): never compiled for the Linux targets RaR ships to. Not reviewed."

[[exemptions.portable-atomic-util]]
version = "0.2.7"
criteria = "safe-to-deploy"

[[exemptions.test-log]]
version = "0.2.20"
criteria = "safe-to-run"

[[exemptions.test-log-core]]
version = "0.2.20"
criteria = "safe-to-run"

[[exemptions.test-log-macros]]
version = "0.2.20"
criteria = "safe-to-run"

[[exemptions.typewit]]
version = "1.15.2"
criteria = "safe-to-deploy"
notes = "Not reviewed. Type-witness helpers used by konst in const evaluation."

[[exemptions.windows-sys]]
version = "0.61.2"
criteria = "safe-to-deploy"
notes = "Windows-only dependency of stacker (cfg(windows)); never compiled for RaR, which targets Linux. Not reviewed."
