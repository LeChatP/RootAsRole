[[audits.shell-words]]
who = "LeChatP <lechatp@outlook.fr>"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = "AI-assisted review (Claude). Whole crate read (forbid(unsafe_code), no build script). split() is a POSIX-like tokenizer; quote() leaves only special-free words bare and single-quotes the rest. Property test on 1,000,000 random word lists (quotes, backslashes, #, ~, newlines, CR, VT, FF, NBSP, NUL): split(join(ws)) == ws, so join is injective, which dosr's argument matching relies on."

