[package]
name = "rootasrole-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Execution primitives for RootAsRole, mostly inspired by sudo-rs, but usable by other projects (mine aswell)."

[dependencies]
rkyv = { version = "0.8" }
libc = "0.2"
ringbuf = ">=0.4, <0.6"
log = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = 1 }
nursery = { level = "warn", priority = 1 }
unwrap_used = { level = "deny", priority = 2 }
similar_names = { level = "allow", priority = 2 }
should_implement_trait = { level = "allow", priority = 2 }
