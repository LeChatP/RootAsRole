[package]
name = "rootasrole-fuzz"
version = "0.0.1"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libpam-sys = "0.2"
nix = { version = ">=0.30, <0.32", default-features = false, features = ["user"] }
rootasrole = { path = "..", default-features = false, features = ["finder", "fuzzing"] }
rootasrole-core = { version = "4", path = "../core", features = ["finder"] }
serde = "1"
serde_json = "1"
cbor4ii = { version = "1.2", default-features = false, features = ["serde", "serde1", "use_std"] }
shell-words = "1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[[bin]]
name = "password_input"
path = "fuzz_targets/password_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_match"
path = "fuzz_targets/command_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "environment"
path = "fuzz_targets/environment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_decision"
path = "fuzz_targets/policy_decision.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_stat"
path = "fuzz_targets/proc_stat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false
