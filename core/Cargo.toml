[package]
name = "rootasrole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "This core crate for the RootAsRole project."
keywords = ["sudo", "capabilities", "rbac", "linux", "security"]

[dependencies]
libc = { version= "0.2", default-features = false, features = ["std"] }
semver = { version = "1.0", default-features = false, features = ["std", "serde"] }
nix = { version = ">=0.30, <0.32", features = ["user","process", "signal", "fs", "hostname", "syslog"] }
capctl = { version= "0.2", default-features = false, features = ["std", "serde"] }
pcre2 = { version = "0.2", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features=["std", "rc", "derive"] }
serde_json = { version= "1.0", default-features = false, features = ["std"] }
glob = { version = "0.3", default-features = false, optional = true }
bitflags = { version = "2.13", default-features = false }
indexmap = { version = "2.14", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false }
log = { version= "0.4", default-features = false }
env_logger = { version= "0.11", default-features = false }
bon = { version = "3", default-features = false, features = ["experimental-overwritable"] }
cbor4ii = { version = "1.2", default-features = false, features = ["serde", "serde1", "use_std"] }
konst = { version= "0.4", default-features = false, features = ["parsing_proc", "iter"] }

[dev-dependencies]
log = { version= "0.4", default-features = false }
serde_test = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = 1 }
nursery = { level = "warn", priority = 1 }
unwrap_used = { level = "deny", priority = 2 }
similar_names = { level = "allow", priority = 2 }
should_implement_trait = { level = "allow", priority = 2 }

[features]
default = ["pcre2", "glob"]
pcre2 = ["dep:pcre2"]
glob = ["dep:glob"]
finder = ["pcre2", "glob"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }
